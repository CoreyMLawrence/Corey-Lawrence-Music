<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Corey Lawrence Music</title>
    
    <!-- PWA & Apple Web App Meta -->
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="128x128" href="./icon-128.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./icon-152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#163264" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Corey's Music" />
    <meta name="apple-touch-startup-image" content="./load.png" />
    <meta name="format-detection" content="telephone=no" />
    
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
  </head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HZM7R7RPG9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-HZM7R7RPG9');
  </script>
  <body>
    <!-- App Root Container -->
    <div id="app" class="app-root">
      <!-- Main Player View -->
      <main class="player-container">
        <!-- Artwork Card -->
        <div class="artwork-card">
          <img
            id="albumArt"
            class="album-art"
            src="./album-art-1024.jpg"
            alt="Corey Lawrence - Old-Time Guitar Recordings"
            draggable="false"
          />
        </div>

        <!-- Track Information -->
        <section class="meta-section">
          <h1 id="songTitle" class="song-title">Waubash Cannonball</h1>
          <p id="artistName" class="artist-name">Corey Lawrence</p>
        </section>

        <!-- Interactive Scrubber -->
        <section class="scrubber-section" aria-label="Audio scrubber">
          <div
            id="progressContainer"
            class="progress-hit-area"
            role="slider"
            tabindex="0"
            aria-label="Seek track position"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div class="progress-track" id="progressTrack">
              <div class="progress-fill" id="progressBar"></div>
              <div class="progress-thumb" id="progressThumb"></div>
            </div>
          </div>
          <div class="timestamps" aria-live="off">
            <span id="countUp" class="time-readout">0:00</span>
            <span id="countDown" class="time-readout">-0:00</span>
          </div>
        </section>

        <!-- Playback Controls -->
        <nav class="controls-container" aria-label="Playback controls">
          <button id="shuffleBtn" class="btn btn-mode" aria-label="Shuffle mode: Off" title="Shuffle">
            <img src="./shuffle.png" alt="Shuffle" />
            <span class="active-dot"></span>
          </button>

          <button id="skipBackBtn" class="btn btn-nav" aria-label="Previous track" title="Previous Track">
            <img src="./skipback.png" alt="Previous Track" />
          </button>

          <button id="playPauseBtn" class="btn btn-play" aria-label="Play track" title="Play / Pause">
            <img id="playPauseImg" src="./play.png" alt="Play" />
          </button>

          <button id="skipForwardBtn" class="btn btn-nav" aria-label="Next track" title="Next Track">
            <img src="./skipforward.png" alt="Next Track" />
          </button>

          <button id="repeatBtn" class="btn btn-mode" aria-label="Repeat mode: Off" title="Repeat">
            <img src="./repeat.png" alt="Repeat" />
            <span class="active-dot"></span>
          </button>
        </nav>

        <!-- Bottom Sheet Drawer Toggle -->
        <div class="drawer-trigger-wrapper">
          <button id="drawerToggleBtn" class="drawer-toggle-btn" aria-label="Toggle song list drawer" aria-expanded="false">
            <span class="drawer-toggle-label">Tracks</span>
            <svg id="drawerChevron" class="drawer-chevron" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
          </button>
        </div>
      </main>

      <!-- Drawer Dimmer / Backdrop -->
      <div id="drawerBackdrop" class="drawer-backdrop" aria-hidden="true"></div>

      <!-- Sliding Song Drawer / Bottom Sheet -->
      <aside id="songDrawer" class="song-drawer" aria-label="Song list" aria-hidden="true">
        <!-- Pull Handle Area for Drag Gestures -->
        <div id="drawerPullBar" class="drawer-pull-bar">
          <div class="drawer-grab-pill"></div>
        </div>

        <div class="drawer-content">
          <div class="drawer-header">
            <h2 class="drawer-title">Tracklist</h2>
            <span class="drawer-subtitle">5 Acoustic Guitar Tracks</span>
          </div>

          <div class="song-list" id="songList">
            <!-- Dynamically populated with active state indicators -->
          </div>
        </div>
      </aside>

      <!-- Native Audio Element -->
      <audio
        id="audioPlayer"
        preload="auto"
        playsinline
        webkit-playsinline
      ></audio>
    </div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js', { scope: './' })
            .catch(err => console.warn('Service worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
