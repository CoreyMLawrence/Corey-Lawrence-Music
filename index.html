<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Corey Lawrence Music</title>

    <!-- PWA & Apple Web App Meta -->
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="128x128" href="./icon-128.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./icon-152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#163264" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Corey's Music" />
    <meta name="apple-touch-startup-image" content="./load.png" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="stylesheet" href="styles.css?v=3.0" />
    <script defer src="script.js?v=3.0"></script>
  </head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HZM7R7RPG9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-HZM7R7RPG9');
  </script>
  <body>
    <!-- App Container -->
    <div id="page-content">
      <!-- Main Player View -->
      <main class="main-player">
        <!-- Album Art -->
        <div class="artwork-container">
          <img
            id="album-art"
            src="./album-art-1024.jpg"
            alt="Old-Time Couch Recordings - Corey Lawrence"
            draggable="false"
          />
        </div>

        <!-- Middle Area: Title, Artist, Scrubber, Controls -->
        <div class="middle-area">
          <h1 id="title">Waubash Cannonball</h1>
          <h4 id="artist">Corey Lawrence</h4>

          <!-- Progress / Scrubber Section -->
          <div
            class="progress-container"
            id="progressContainer"
            role="slider"
            tabindex="0"
            aria-label="Seek position"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div class="progress" id="progressTrack">
              <div class="progress-bar" id="progressBar"></div>
              <div class="progress-thumb" id="progressThumb"></div>
            </div>
          </div>

          <!-- Time Display -->
          <div class="time">
            <span id="count-up">0:00</span>
            <span id="count-down">-0:00</span>
          </div>

          <!-- Controls -->
          <div class="controls">
            <button class="control-button skip-button" id="skipBackButton" aria-label="Previous Track">
              <img src="./skipback.png" alt="Previous Track" />
            </button>

            <button class="control-button play-button" id="playPauseButton" aria-label="Play Track">
              <img id="playPauseImg" src="./play.png" alt="Play / Pause" />
            </button>

            <button class="control-button skip-button" id="skipForwardButton" aria-label="Next Track">
              <img src="./skipforward.png" alt="Next Track" />
            </button>
          </div>
        </div>

        <!-- Arrow Navigation Button to toggle drawer -->
        <button id="arrow-link" aria-label="Toggle song list" aria-expanded="false">
          <img id="image" src="./down-arrow.png" alt="Navigation arrow" />
        </button>
      </main>

      <!-- Drawer Backdrop (dimmer on mobile) -->
      <div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"></div>

      <!-- Song Area / Drawer -->
      <section id="song-area" aria-label="Tracklist">
        <div class="drawer-handle" id="drawerHandle">
          <div class="handle-bar"></div>
        </div>

        <div class="song-list-scroll">
          <div class="song playing" id="waubash-song" role="button" tabindex="0" data-index="0">
            <p class="song-title">Waubash Cannonball</p>
            <p class="song-time">1:35</p>
          </div>
          <div class="separator"></div>

          <div class="song" id="windyandwarm-song" role="button" tabindex="0" data-index="1">
            <p class="song-title">Windy & Warm</p>
            <p class="song-time">2:19</p>
          </div>
          <div class="separator"></div>

          <div class="song" id="freighttrain-song" role="button" tabindex="0" data-index="2">
            <p class="song-title">Freight Train</p>
            <p class="song-time">1:54</p>
          </div>
          <div class="separator"></div>

          <div class="song" id="cannonballrag-song" role="button" tabindex="0" data-index="3">
            <p class="song-title">Cannonball Rag</p>
            <p class="song-time">1:40</p>
          </div>
          <div class="separator"></div>

          <div class="song" id="docsguitar-song" role="button" tabindex="0" data-index="4">
            <p class="song-title">Doc's Guitar</p>
            <p class="song-time">0:58</p>
          </div>
        </div>
      </section>

      <!-- Audio Element -->
      <audio
        id="audioPlayer"
        preload="auto"
        playsinline
        webkit-playsinline
      ></audio>
    </div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js', { scope: './' })
            .catch(err => console.warn('SW failed:', err));
        });
      }
    </script>
  </body>
</html>
