<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Corey Lawrence Music</title>
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="stylesheet" href="styles.css?v=9.0" />
    <meta name="theme-color" content="#163264" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Corey's Music" />
    <link rel="apple-touch-icon" sizes="128x128" href="icon-128.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-touch-startup-image" content="load.png" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script defer src="script.js?v=9.0"></script>
  </head>
  <!-- Google tag (gtag.js) -->
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-HZM7R7RPG9"
  ></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag('js', new Date());
    gtag('config', 'G-HZM7R7RPG9');
  </script>
  <body>
    <div id="page-content">
      <!-- Safari Notch Area Tint Anchor -->
      <div class="notch-tint"></div>

      <!-- Main Player View (Slides up like a curtain to reveal queue underneath) -->
      <div class="main-player" id="mainPlayer">
        <!-- Hidden Native Audio Element -->
        <audio
          id="audioPlayer"
          preload="auto"
          poster="audio-poster.jpg"
          crossorigin="anonymous"
          playsinline
          webkit-playsinline
          x-webkit-airplay="allow"
          style="display: none"
        ></audio>

        <!-- Main Column (Artwork and controls close together near top safe area) -->
        <div class="player-content">
          <!-- Large Album Artwork -->
          <div class="artwork-container">
            <img
              class="no-zoom"
              id="album-art"
              src="./album-art-1024.jpg"
              alt="Old-Time Couch Recordings"
              draggable="false"
            />
          </div>

          <!-- Controls Section (Grouped cohesively below album) -->
          <div class="player-controls-group">
            <!-- Track Info Row: Title & Artist on Left, Favorite on Right -->
            <div class="track-info-row">
              <div class="track-text">
                <h1 id="title">Waubash Cannonball</h1>
                <h4 id="artist">Corey Lawrence</h4>
              </div>
              <button class="icon-btn heart-btn" id="heartButton" aria-label="Save to Liked Songs">
                <svg id="heartIcon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
              </button>
            </div>

            <!-- Progress Bar & Timestamp Slider -->
            <div class="progress-section">
              <div class="progress-container" id="progressContainer">
                <div class="progress-track" id="progressTrack">
                  <div class="progress-bar" id="progressBar"></div>
                  <div class="progress-thumb" id="progressThumb"></div>
                </div>
              </div>
              <div class="time-row">
                <div id="count-up">0:00</div>
                <div id="count-down">-0:00</div>
              </div>
            </div>

            <!-- Playback Controls (Spotify Spacing & Sizes) -->
            <div class="controls-row">
              <button class="control-btn shuffle-btn" id="shuffleButton" aria-label="Shuffle playback">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="16 3 21 3 21 8"></polyline>
                  <line x1="4" y1="20" x2="21" y2="3"></line>
                  <polyline points="21 16 21 21 16 21"></polyline>
                  <line x1="15" y1="15" x2="21" y2="21"></line>
                  <line x1="4" y1="4" x2="9" y2="9"></line>
                </svg>
              </button>

              <button class="control-btn skip-btn" id="skipBackButton" aria-label="Previous Track">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="white">
                  <path d="M6 5v14h2V5H6zm3 7l11 7V5l-11 7z"></path>
                </svg>
              </button>

              <button class="control-btn play-pause-btn" id="playPauseButton" aria-label="Play / Pause">
                <svg id="playIconSvg" viewBox="0 0 24 24" width="28" height="28" fill="black">
                  <polygon points="8,5 19,12 8,19"></polygon>
                </svg>
              </button>

              <button class="control-btn skip-btn" id="skipForwardButton" aria-label="Next Track">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="white">
                  <path d="M16 5v14h2V5h-2zm-12 14l11-7-11-7v14z"></path>
                </svg>
              </button>

              <button class="control-btn repeat-btn" id="repeatButton" aria-label="Repeat mode">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="17 1 21 5 17 9"></polyline>
                  <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                  <polyline points="7 23 3 19 7 15"></polyline>
                  <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Generous breathing space below controls -->
        <div class="bottom-spacer"></div>
      </div>

      <!-- Little Shallow Arrow at Bottom (Anchored at very bottom always, flips vertically) -->
      <a id="arrow-link" role="button" aria-label="Toggle track list" tabindex="0">
        <img
          id="image"
          class="no-zoom"
          src="down-arrow.png"
          alt="Toggle track list"
          draggable="false"
        />
      </a>

      <!-- Song Area (Stationed BEHIND the main player - Spotify Queue Layout) -->
      <div id="song-area">
        <div class="queue-header">
          <div>
            <div class="queue-title">Now Playing Queue</div>
            <div class="queue-subtitle">Old-Time Couch Recordings</div>
          </div>
          <span class="queue-count">5 songs</span>
        </div>

        <div class="song-list">
          <!-- Waubash Cannonball -->
          <div id="waubash-song" class="song song-row playing" data-index="0">
            <div class="song-left">
              <span class="song-number">1</span>
              <div class="song-details">
                <span class="song-name">Waubash Cannonball</span>
                <span class="song-artist-name">Corey Lawrence</span>
              </div>
            </div>
            <span class="song-duration">1:35</span>
          </div>

          <!-- Windy & Warm -->
          <div id="windyandwarm-song" class="song song-row" data-index="1">
            <div class="song-left">
              <span class="song-number">2</span>
              <div class="song-details">
                <span class="song-name">Windy & Warm</span>
                <span class="song-artist-name">Corey Lawrence</span>
              </div>
            </div>
            <span class="song-duration">2:19</span>
          </div>

          <!-- Freight Train -->
          <div id="freighttrain-song" class="song song-row" data-index="2">
            <div class="song-left">
              <span class="song-number">3</span>
              <div class="song-details">
                <span class="song-name">Freight Train</span>
                <span class="song-artist-name">Corey Lawrence</span>
              </div>
            </div>
            <span class="song-duration">1:54</span>
          </div>

          <!-- Cannonball Rag -->
          <div id="cannonballrag-song" class="song song-row" data-index="3">
            <div class="song-left">
              <span class="song-number">4</span>
              <div class="song-details">
                <span class="song-name">Cannonball Rag</span>
                <span class="song-artist-name">Corey Lawrence</span>
              </div>
            </div>
            <span class="song-duration">1:40</span>
          </div>

          <!-- Doc's Guitar -->
          <div id="docsguitar-song" class="song song-row" data-index="4">
            <div class="song-left">
              <span class="song-number">5</span>
              <div class="song-details">
                <span class="song-name">Doc's Guitar</span>
                <span class="song-artist-name">Corey Lawrence</span>
              </div>
            </div>
            <span class="song-duration">0:58</span>
          </div>
        </div>
      </div>

      <!-- Safari Bottom URL Bar Tint Anchor -->
      <div class="bottom-tint"></div>
    </div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js', { scope: './' })
            .catch(err => console.warn('SW registration failed', err));
        });
      }
    </script>
  </body>
</html>
